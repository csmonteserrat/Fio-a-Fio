<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel Fio a Fio</title>
<meta name="fio-version" content="1.4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<script src="https://unpkg.com/lucide@0.470.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="adapter.js"></script>
<style>
/* Layout: Boardto shell. Floating 212px sidebar, 74px top bar, white panels on an off-white page. Q1 violet, Q2 cyan, Q3 orange identify the three sources everywhere. */
:root{
  --page:#f7f8fc; --card:#ffffff; --sunken:#f1f3f9; --hover:#f1f3f9;
  --heading:#1f1f39; --body:#3b3b58; --secondary:#6e7191; --muted:#8e8ea9;
  --divider:#eceff7; --border:#e7e9f4; --border-strong:#d8dcea;
  --brand:#7551e9; --brand-hover:#6540db; --brand-press:#5432bd; --brand-soft:#f0ebfe; --on-brand:#ffffff; --focus:#a98ff2;
  --q1:#7551e9; --q1-soft:#f0ebfe; --q2:#0f9fd0; --q2-soft:#e6f7fe; --q3:#e0700f; --q3-soft:#fff1e4;
  --success:#22a878; --warn-soft:#fff6e8; --warn-ink:#8a4a07; --danger:#d9362c;
  --shadow-sm:0 4px 14px rgba(31,31,57,.05); --shadow-md:0 8px 24px rgba(31,31,57,.07); --shadow-lg:0 18px 44px rgba(31,31,57,.10);
  --shadow-brand:0 10px 24px rgba(117,81,233,.32);
  --sans:"Poppins","Segoe UI",system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#14142a; --card:#1e1e38; --sunken:#272747; --hover:#2a2a4c;
  --heading:#f3f3fa; --body:#d6d7e6; --secondary:#a6a8c2; --muted:#7c7f9c;
  --divider:#2b2b4b; --border:#33335a; --border-strong:#46466f;
  --brand:#8f71f0; --brand-hover:#a28af3; --brand-press:#b49ff6; --brand-soft:#2d2656; --on-brand:#ffffff; --focus:#b49ff6;
  --q1:#9b80f3; --q1-soft:#2d2656; --q2:#3fc4ef; --q2-soft:#143246; --q3:#f59a4c; --q3-soft:#3a2716;
  --success:#3fcf9a; --warn-soft:#3a2c14; --warn-ink:#f5c27a; --danger:#f2766e;
  --shadow-sm:0 4px 14px rgba(0,0,0,.25); --shadow-md:0 8px 24px rgba(0,0,0,.32); --shadow-lg:0 18px 44px rgba(0,0,0,.4);
  --shadow-brand:0 10px 24px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --page:#14142a; --card:#1e1e38; --sunken:#272747; --hover:#2a2a4c;
  --heading:#f3f3fa; --body:#d6d7e6; --secondary:#a6a8c2; --muted:#7c7f9c;
  --divider:#2b2b4b; --border:#33335a; --border-strong:#46466f;
  --brand:#8f71f0; --brand-hover:#a28af3; --brand-press:#b49ff6; --brand-soft:#2d2656; --on-brand:#ffffff; --focus:#b49ff6;
  --q1:#9b80f3; --q1-soft:#2d2656; --q2:#3fc4ef; --q2-soft:#143246; --q3:#f59a4c; --q3-soft:#3a2716;
  --success:#3fcf9a; --warn-soft:#3a2c14; --warn-ink:#f5c27a; --danger:#f2766e;
  --shadow-sm:0 4px 14px rgba(0,0,0,.25); --shadow-md:0 8px 24px rgba(0,0,0,.32); --shadow-lg:0 18px 44px rgba(0,0,0,.4);
  --shadow-brand:0 10px 24px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{background:var(--page);color:var(--body);font:400 14px/22px var(--sans);padding-inline:16px;padding-block:20px}
h1,h2,h3{color:var(--heading);margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:212px minmax(0,1fr);gap:24px;max-width:1440px;margin:0 auto}
/* sidebar */
.side{background:var(--card);border-radius:14px;box-shadow:var(--shadow-md);padding:22px 14px;position:sticky;top:calc(20px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:4px}
.mark{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.mark svg{flex:none}
.mark b{font-weight:600;font-size:17px;color:var(--heading);letter-spacing:-.01em;line-height:20px}
.mark small{display:block;font-size:11px;color:var(--secondary);line-height:15px;font-weight:500}
.nav{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;border:0;background:none;color:var(--secondary);cursor:pointer;text-align:left;font-weight:500;transition:background 180ms var(--ease),color 180ms var(--ease);width:100%}
.nav:hover{background:var(--hover);color:var(--heading)}
.nav.on{background:var(--brand);color:var(--on-brand);box-shadow:var(--shadow-brand)}
.nav svg{width:20px;height:20px;stroke-width:1.6;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:600;background:var(--sunken);color:var(--secondary);border-radius:999px;padding:0 8px;line-height:20px}
.nav.on .cnt{background:rgba(255,255,255,.22);color:var(--on-brand)}
.side .sep{height:1px;background:var(--divider);margin:10px 6px}
.side .foot{font-size:11px;line-height:16px;color:var(--secondary);padding:6px 10px 0}
/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;min-height:74px;padding-bottom:18px}
.top h1{font-size:22px;line-height:30px}
.top p{margin:2px 0 0;color:var(--secondary);font-size:13px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:8px;padding:9px 16px;font-weight:500;cursor:pointer;background:var(--card);color:var(--heading);box-shadow:inset 0 0 0 1px var(--border-strong);transition:background 180ms var(--ease),transform 120ms var(--ease),box-shadow 180ms var(--ease);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px;stroke-width:1.8}
.btn.pri{background:var(--brand);color:var(--on-brand);box-shadow:var(--shadow-brand)}
.btn.pri:hover{background:var(--brand-hover)}
.btn.ghost{box-shadow:none;background:transparent;color:var(--secondary)}
.btn.ghost:hover{background:var(--hover);color:var(--heading)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* panels */
.panel{background:var(--card);border-radius:14px;box-shadow:var(--shadow-md);padding:24px;min-width:0}
.panel>header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.panel h2{font-size:17px;line-height:24px}
.panel .sub{font-size:12px;color:var(--secondary);margin-top:2px;line-height:18px}
.grid{display:grid;gap:24px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:24px}
/* banner */
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn-ink);border-radius:12px;padding:12px 18px;font-size:13px}
.banner b{font-weight:600}
.banner .btn{background:var(--card)}
/* kpi */
.kpi{background:var(--card);border-radius:12px;box-shadow:var(--shadow-sm);padding:20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .lab{font-size:12px;font-weight:500;color:var(--secondary);display:flex;align-items:center;gap:8px}
.kpi .dot{width:10px;height:10px;border-radius:999px;flex:none}
.kpi .val{font-size:28px;line-height:38px;font-weight:600;color:var(--heading)}
.kpi .val small{font-size:13px;color:var(--secondary);font-weight:500}
.track{height:6px;background:var(--sunken);border-radius:999px;overflow:hidden}
.track i{display:block;height:100%;border-radius:999px}
.kpi .note{font-size:12px;color:var(--secondary)}
/* bars */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,11.5em) minmax(0,1fr) 3.4em;gap:10px;align-items:center;font-size:12.5px}
.bar .l{color:var(--body);line-height:16px;overflow-wrap:anywhere}
.bar .t{height:10px;background:var(--sunken);border-radius:999px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:999px;min-width:2px}
.bar .v{text-align:right;color:var(--heading);font-weight:600;font-variant-numeric:tabular-nums}
.bar .v small{color:var(--secondary);font-weight:500}
.empty-mini{color:var(--secondary);font-size:13px;padding:18px 0;text-align:center}
/* convergence table */
.tw{overflow-x:auto;margin:0 -8px;padding:0 8px}
table.conv{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.conv th{font-size:11px;font-weight:600;color:var(--secondary);text-align:left;padding:0 10px 10px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.conv td{padding:10px;border-top:1px solid var(--divider);vertical-align:middle}
.conv td.name{font-weight:500;color:var(--heading)}
.conv .mini{display:flex;align-items:center;gap:8px}
.conv .mini .t{width:72px;height:8px;background:var(--sunken);border-radius:999px;overflow:hidden;flex:none}
.conv .mini .t i{display:block;height:100%;border-radius:999px}
.conv .mini span{font-variant-numeric:tabular-nums;color:var(--heading);font-weight:500}
.conv .mini small{color:var(--secondary)}
.conv tr.hi td{background:var(--brand-soft)}
.conv tr.hi td:first-child{border-radius:10px 0 0 10px}
.conv tr.hi td:last-child{border-radius:0 10px 10px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip.s3{background:var(--brand);color:var(--on-brand)}
.chip.s2{background:var(--brand-soft);color:var(--brand)}
.chip.s1{background:var(--sunken);color:var(--secondary)}
.chip.s0{color:var(--muted)}
.chip.gp{background:var(--q3-soft);color:var(--q3)}
.chip.gn{background:var(--q1-soft);color:var(--q1)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--secondary)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:999px;display:inline-block}
.thread circle{stroke-width:1.6}
/* scatter */
.scatter svg{width:100%;height:auto;display:block}
.scatter text{fill:var(--secondary);font-family:var(--sans)}
/* forms */
.formwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.part{background:var(--card);border-radius:14px;box-shadow:var(--shadow-md);padding:22px 24px}
.part>h3{font-size:15px;line-height:22px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.part>h3 .pn{font-size:11px;font-weight:600;color:var(--brand);background:var(--brand-soft);border-radius:6px;padding:1px 8px;letter-spacing:.02em}
.fld{padding:12px 0;border-top:1px solid var(--divider)}
.part>h3+.fld{border-top:0;padding-top:0}
.fld>.q{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.fld>.q .n{flex:none;min-width:26px;height:22px;border-radius:6px;background:var(--sunken);color:var(--heading);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 5px}
.fld>.q label,.fld>.q .qt{font-weight:500;color:var(--heading);font-size:13.5px;line-height:20px}
.abis-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.abchip{font:inherit;font-size:13.5px;border:1px solid var(--border-strong);background:var(--card);color:var(--body);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.abchip:hover:not(:disabled){border-color:var(--q3)}.abchip.on{background:var(--q3);border-color:var(--q3);color:#fff}
.abchip.done:not(.on){border-color:var(--q3);color:var(--heading);font-weight:600}.abchip:disabled{opacity:.45;cursor:not-allowed}
.abis-ta[hidden]{display:none}
.fld .hint{font-size:12px;color:var(--secondary);margin:-4px 0 8px 36px}
.fld .body{margin-left:36px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.naow{margin-top:8px}
.pill{position:relative;display:inline-flex}
.pill input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pill span{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 13px;font-size:12.5px;line-height:18px;background:var(--sunken);color:var(--body);cursor:pointer;transition:background 180ms var(--ease),color 180ms var(--ease);border:1px solid transparent}
.pill:hover span{background:var(--hover);border-color:var(--border-strong)}
.pill input:checked+span{background:var(--brand);color:var(--on-brand)}
.pill input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.pill input:disabled+span{opacity:.45;cursor:not-allowed}
.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.pw{display:inline-flex;align-items:center;gap:3px}
.star{position:relative;display:inline-flex}
.star input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.star span{width:28px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);background:transparent;cursor:pointer;transition:background 180ms var(--ease),color 180ms var(--ease)}
.star input:not(:disabled)+span:hover{background:var(--hover)}
.star input:checked+span{background:var(--q3);color:#fff}
.star input:disabled+span{opacity:.3;cursor:default}
.star input:focus-visible+span{outline:2px solid var(--focus)}
.gneed{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--warn-bg,#fff4e0);color:var(--warn-ink,#7a4b00);font-size:13px}
.pctfill{font-weight:600}.pctfill.hi{color:var(--ok-ink,#1b7a43)}.pctfill.mid{color:var(--warn-ink,#7a4b00)}.pctfill.lo{color:var(--danger-ink,#b42318)}
.gnote{font-size:12.5px;color:var(--secondary);background:var(--sunken);border-radius:8px;padding:8px 12px;margin-bottom:12px}
.gnote b{color:var(--heading);font-weight:600;margin-left:4px}
.groups h4{margin:0 0 7px;font-size:11px;font-weight:600;color:var(--secondary);letter-spacing:.05em;text-transform:uppercase}
.groups .pills{gap:6px}
.inp,.ta,.sel{width:100%;border:0;border-radius:8px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--border);padding:9px 12px;font-size:13px;line-height:20px;transition:box-shadow 180ms var(--ease)}
.ta{resize:vertical;min-height:62px}
.inp:focus,.ta:focus,.sel:focus{outline:none;box-shadow:inset 0 0 0 2px var(--focus);background:var(--card)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;margin-bottom:8px}
.row>span{font-size:12px;font-weight:500;color:var(--secondary);white-space:nowrap}
.tc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,15em);gap:8px}
.tcl .tc{margin-bottom:8px}
.tcl .lbl{font-size:12px;font-weight:500;color:var(--secondary);margin-bottom:4px}
.sel{appearance:auto}
.sel.code{background:var(--warn-soft);box-shadow:inset 0 0 0 1px var(--border-strong)}
.meta3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.meta3 label{font-size:12px;font-weight:500;color:var(--secondary);display:flex;flex-direction:column;gap:4px}
table.mx{width:100%;border-collapse:collapse;font-size:12.5px;min-width:430px}.mx .seg span{width:23px}.mx td,.mx th{padding-left:4px;padding-right:4px}
.mx th{font-size:11px;color:var(--secondary);font-weight:600;text-align:center;padding:0 6px 8px;text-transform:uppercase;letter-spacing:.02em}
.mx th:first-child{text-align:left}
.mx td{border-top:1px solid var(--divider);padding:6px}
.mx td:first-child{color:var(--heading);font-weight:500}
.seg{display:inline-flex;background:var(--sunken);border-radius:8px;padding:2px;gap:2px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;width:26px;text-align:center;border-radius:6px;font-size:12px;line-height:24px;font-weight:500;color:var(--secondary);cursor:pointer}
.seg input:checked+span{background:var(--q3);color:#fff}
.seg input:focus-visible+span{outline:2px solid var(--focus)}
/* matriz do Q3: cores das notas */
.seg.f input[value="1"]+span{box-shadow:inset 0 -3px 0 #278a4d}.seg.f input[value="1"]:checked+span{background:#278a4d;color:#fff;box-shadow:none;font-weight:700}
.seg.i input[value="1"]+span{box-shadow:inset 0 -3px 0 #d63d3d}.seg.i input[value="1"]:checked+span{background:#d63d3d;color:#fff;box-shadow:none;font-weight:700}
.seg.f input[value="2"]+span{box-shadow:inset 0 -3px 0 #8fbf3b}.seg.f input[value="2"]:checked+span{background:#8fbf3b;color:#1f2d08;box-shadow:none;font-weight:700}
.seg.i input[value="2"]+span{box-shadow:inset 0 -3px 0 #ee8a2e}.seg.i input[value="2"]:checked+span{background:#ee8a2e;color:#3a1d00;box-shadow:none;font-weight:700}
.seg.f input[value="3"]+span{box-shadow:inset 0 -3px 0 #f0c03c}.seg.f input[value="3"]:checked+span{background:#f0c03c;color:#3a2a00;box-shadow:none;font-weight:700}
.seg.i input[value="3"]+span{box-shadow:inset 0 -3px 0 #f0c03c}.seg.i input[value="3"]:checked+span{background:#f0c03c;color:#3a2a00;box-shadow:none;font-weight:700}
.seg.f input[value="4"]+span{box-shadow:inset 0 -3px 0 #ee8a2e}.seg.f input[value="4"]:checked+span{background:#ee8a2e;color:#3a1d00;box-shadow:none;font-weight:700}
.seg.i input[value="4"]+span{box-shadow:inset 0 -3px 0 #8fbf3b}.seg.i input[value="4"]:checked+span{background:#8fbf3b;color:#1f2d08;box-shadow:none;font-weight:700}
.seg.f input[value="5"]+span{box-shadow:inset 0 -3px 0 #d63d3d}.seg.f input[value="5"]:checked+span{background:#d63d3d;color:#fff;box-shadow:none;font-weight:700}
.seg.i input[value="5"]+span{box-shadow:inset 0 -3px 0 #278a4d}.seg.i input[value="5"]:checked+span{background:#278a4d;color:#fff;box-shadow:none;font-weight:700}
.mx th small{display:block;font-weight:400;text-transform:none;letter-spacing:0;font-size:10.5px;margin-top:2px;color:var(--secondary)}
.mxnote{font-size:13px;line-height:20px;background:var(--sunken);border-radius:10px;padding:10px 14px;margin-bottom:12px}.mxnote p{margin:0 0 6px}.mxnote p:last-child{margin:0}
.mxna{font:inherit;font-size:16px;line-height:1;width:30px;height:30px;border-radius:8px;border:1px solid var(--border-strong);background:var(--card);color:var(--secondary);cursor:pointer}
.mxna:hover{border-color:var(--q3);color:var(--q3)}.mx tr.na .mxna{background:var(--q3);border-color:var(--q3);color:#fff}
.mxlab{display:flex;align-items:center;gap:8px}.mxlab span{min-width:0}.mx th:first-child small{text-align:left}
.mx tr.na .mxlab span{text-decoration:line-through;opacity:.55}.mx tr.na .seg{opacity:.3;pointer-events:none}
.seg input:disabled{cursor:not-allowed}

.ux{position:relative;display:inline-flex}
.ux input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.ux span{width:28px;height:28px;border-radius:8px;background:var(--sunken);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--muted);cursor:pointer}
.ux input:checked+span{background:var(--danger);color:#fff}
.ux input:focus-visible+span{outline:2px solid var(--focus)}
.savebar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:16px;background:var(--card);border-radius:12px;box-shadow:var(--shadow-lg);padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;z-index:5}
.savebar .st{font-size:12.5px;color:var(--secondary)}
.savebar .st b{color:var(--heading);font-weight:600}
/* record list */
.reclist{display:flex;flex-direction:column}
.rec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--divider)}
.rec:first-child{border-top:0}
.rec .code{font-weight:600;color:var(--heading);font-size:13px;background:var(--sunken);border-radius:7px;padding:2px 8px;font-variant-numeric:tabular-nums}

/* ---------------- cálculos ---------------- */
function compute(D){
  const n1=D.q1.length,n2=D.q2.length,n3=D.q3.length;
  const T=id=>Q1ALL.find(t=>t.id===id);
  const zeroT=()=>Object.fromEntries(Q1ALL.map(t=>[t.id,0])),zeroM=()=>Object.fromEntries(MACROS.map(m=>[m.id,0]));
  const tc={q1:zeroT(),q2:zeroT(),q3:zeroT()},tu={q2:zeroT(),q3:zeroT()},mr={q1:zeroM(),q2:zeroM(),q3:zeroM()},mu={q2:zeroM(),q3:zeroM()};
  ["q1","q2","q3"].forEach(q=>D[q].forEach(r=>{const set=new Set();(r.temas||[]).forEach(id=>{if(id in tc[q]){tc[q][id]++;set.add(T(id).macro)}});set.forEach(m=>mr[q][m]++);
    if(q!=="q1")(r.temasU||[]).forEach(id=>{if(id in tu[q]){tu[q][id]++;mu[q][T(id).macro]++}})}));
  const pedidos=zeroM();D.q1.forEach(r=>{if(r.q10c)pedidos[r.q10c]=(pedidos[r.q10c]||0)+1});
  const q2open=zeroM();D.q2.forEach(r=>{(r.q3||[]).forEach(x=>{if(x&&x.c)q2open[x.c]++});(r.q11||[]).forEach(x=>{if(x&&x.c)mu.q2[x.c]++})});
  const dist=(k,opts,arr)=>opts.map(o=>({label:o,value:arr.filter(x=>x[k]===o).length}));
  const q9=OPT.q9.map(o=>({label:o,value:D.q1.filter(r=>(r.q9||[]).includes(o)).length}));
  const barr=OPT.barreiras.map(o=>({label:o,value:D.q2.filter(r=>(r.q8||[]).includes(o)).length}));
  const outrasB=D.q2.filter(r=>r.q8outra).length;if(outrasB)barr.push({label:"Outra razão",value:outrasB});
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const q3m={};MX.forEach(m=>{const fs=[],is=[];D.q3.forEach(r=>{const v=r.mx&&r.mx[m.id];if(!v)return;if(v.f)fs.push(+v.f);if(v.i)is.push(+v.i)});
    const f=avg(fs),i=avg(is);q3m[m.id]={f,i,u:mu.q3[m.id],score:f!=null&&i!=null?f*i:null}});
  const obst=OPT.obst.map(o=>({label:o,value:D.q3.filter(r=>(r.q6||[]).includes(o)).length}));
  const outO=D.q3.filter(r=>r.q6outro).length;if(outO)obst.push({label:"Outro",value:outO});
  // convergência por macro-tema
  const rows=MX.map(m=>({id:m.id,label:m.label,q1:n1?mr.q1[m.id]/n1:null,ped:pedidos[m.id],q2:n2?mr.q2[m.id]/n2:null,q2u:mu.q2[m.id],q2o:q2open[m.id],q3:q3m[m.id]}));
  const mean=k=>avg(rows.map(k).filter(x=>x!=null));
  const m1=mean(r=>r.q1),m2=mean(r=>r.q2),m3=mean(r=>r.q3.score);
  const mx1=Math.max(0,...rows.map(r=>r.q1||0)),mx2=Math.max(0,...rows.map(r=>r.q2||0)),mx3=Math.max(0,...rows.map(r=>r.q3.score||0));
  rows.forEach(r=>{r.f1=r.q1!=null&&r.q1>0&&r.q1>m1;r.f2=r.q2!=null&&r.q2>0&&r.q2>m2;r.f3=r.q3.score!=null&&r.q3.score>m3;r.stars=(r.f1?1:0)+(r.f2?1:0)+(r.f3?1:0);
    r.norm=(mx1?(r.q1||0)/mx1:0)+(mx2?(r.q2||0)/mx2:0)+(mx3?(r.q3.score||0)/mx3:0)});
  rows.sort((a,b)=>b.stars-a.stars||b.norm-a.norm);
  // comparação tema a tema (mesma lista nas três escutas)
  const ns={q1:n1,q2:n2,q3:n3},pct=q=>Object.fromEntries(Q1ALL.map(t=>[t.id,ns[q]?tc[q][t.id]/ns[q]:null]));
  const P={q1:pct("q1"),q2:pct("q2"),q3:pct("q3")},MAXP={};["q1","q2","q3"].forEach(q=>MAXP[q]=Math.max(0,...Object.values(P[q]).map(v=>v||0)));
  const rel=(q,id)=>P[q][id]==null||!MAXP[q]?null:P[q][id]/MAXP[q];
  const cmp=Q1ALL.map(t=>{const cat=Q1T.find(g=>g.items.includes(t)).cat;const r1=rel("q1",t.id),pr=[rel("q2",t.id),rel("q3",t.id)].filter(v=>v!=null),rp=pr.length?avg(pr):null;
    return{id:t.id,label:t.label,cat,p1:P.q1[t.id],p2:P.q2[t.id],p3:P.q3[t.id],u2:tu.q2[t.id],u3:tu.q3[t.id],r1,rp,gap:r1!=null&&rp!=null?rp-r1:null,avgRel:avg([r1,rp].filter(v=>v!=null))||0}});
  const outroCodes=pedidos.outro+q2open.outro+mu.q2.outro;
  return{n1,n2,n3,tCount:tc.q1,q9,q8:dist("q8",OPT.tv,D.q1),idade:dist("idade",OPT.idade,D.q1),genero:dist("genero",OPT.genero,D.q1),barr,obst,q3m,rows,cmp,outroCodes,
    revisao:dist("q11",OPT.revisao,D.q3),pedidos};
}

/* ---------------- componentes visuais ---------------- */
function bars(items,color,opts={}){
  const max=opts.max||Math.max(1,...items.map(i=>i.value));const tot=opts.total;
  if(!items.some(i=>i.value))return`<div class="empty-mini">Sem respostas ainda.</div>`;
  return`<div class="bars">${items.map(i=>`<div class="bar"><span class="l">${esc(i.label)}</span><span class="t"><i style="width:${(i.value/max*100).toFixed(1)}%;background:${color}"></i></span><span class="v">${i.value}${tot?` <small>${Math.round(i.value/tot*100)}%</small>`:""}</span></div>`).join("")}</div>`;
}
function thread(r){
  const c=["var(--q1)","var(--q2)","var(--q3)"],f=[r.f1,r.f2,r.f3];
  return`<svg class="thread" width="58" height="16" viewBox="0 0 58 16" aria-hidden="true"><path d="M4 8 C12 1 17 15 29 8 S46 1 54 8" fill="none" stroke="var(--border-strong)" stroke-width="1.4"/>${[6,29,52].map((x,i)=>`<circle cx="${x}" cy="8" r="5" fill="${f[i]?c[i]:"var(--card)"}" stroke="${f[i]?c[i]:"var(--border-strong)"}"/>`).join("")}</svg>`;
}
function convTable(C){
  const any=C.n1||C.n2||C.n3;
  if(!any)return`<div class="empty-mini">Os temas aparecem aqui assim que houver questionários digitados.</div>`;
  const lab={3:"Convergente",2:"Forte",1:"Parcial",0:"Sem destaque"};
  return`<div class="tw"><table class="conv"><thead><tr><th>Macro-tema</th><th>Comunidade · Q1</th><th>ACS · Q2</th><th>Equipe · Q3</th><th>Fios</th><th>Leitura</th></tr></thead><tbody>${C.rows.map(r=>{
    const s3=r.q3.score;
    return`<tr class="${r.stars===3?"hi":""}"><td class="name">${esc(r.label)}</td>
    <td>${r.q1==null?'<small class="sub">sem dados</small>':`<div class="mini"><span class="t"><i style="width:${(r.q1*100).toFixed(0)}%;background:var(--q1)"></i></span><span>${Math.round(r.q1*100)}%</span>${r.ped?`<small>${r.ped} pedido${r.ped>1?"s":""}</small>`:""}</div>`}</td>
    <td>${r.q2==null?'<small class="sub">sem dados</small>':`<div class="mini"><span class="t"><i style="width:${(r.q2*100).toFixed(0)}%;background:var(--q2)"></i></span><span>${Math.round(r.q2*100)}%</span>${r.q2u?`<small>${r.q2u} urg</small>`:""}</div>`}</td>
    <td>${s3==null?'<small class="sub">sem dados</small>':`<div class="mini"><span>${s3.toFixed(1)}</span><small>F ${r.q3.f.toFixed(1)} × I ${r.q3.i.toFixed(1)}${r.q3.u?` · ${r.q3.u} urg`:""}</small></div>`}</td>
    <td>${thread(r)}</td><td><span class="chip s${r.stars}">${lab[r.stars]}</span></td></tr>`}).join("")}</tbody></table></div>`;
}
const GAP=.35;
function cmpCell(p,u,color){if(p==null)return'<small class="sub">sem dados</small>';return`<div class="mini"><span class="t"><i style="width:${(p*100).toFixed(0)}%;background:${color}"></i></span><span>${Math.round(p*100)}%</span>${u?`<small>★${u}</small>`:""}</div>`}
function compareTable(C){
  if(!C.n1||!(C.n2||C.n3))return`<div class="empty-mini">A comparação aparece quando houver respostas de pacientes e de ACS ou equipe.</div>`;
  const mode=S.cmp||"gapPos";let list=[...C.cmp];
  if(mode==="all")list.sort((a,b)=>b.avgRel-a.avgRel);
  else if(mode==="gapPos")list=list.filter(r=>r.gap!=null&&r.gap>=GAP).sort((a,b)=>b.gap-a.gap);
  else list=list.filter(r=>r.gap!=null&&r.gap<=-GAP).sort((a,b)=>a.gap-b.gap);
  const tab=(id,l,n)=>`<label class="pill"><input type="radio" name="cmpm" value="${id}" ${mode===id?"checked":""}><span>${l}${n!=null?` <span class="num">${n}</span>`:""}</span></label>`;
  const nPos=C.cmp.filter(r=>r.gap!=null&&r.gap>=GAP).length,nNeg=C.cmp.filter(r=>r.gap!=null&&r.gap<=-GAP).length;
  const chip=r=>r.gap==null?"":r.gap>=GAP?`<span class="chip gp">Necessidade não percebida</span>`:r.gap<=-GAP?`<span class="chip gn">Demanda não vista</span>`:`<span class="chip s1">Em sintonia</span>`;
  return`<div class="pills" style="margin-bottom:14px">${tab("gapPos","Equipe vê, comunidade não pede",nPos)}${tab("gapNeg","Comunidade pede, equipe não vê",nNeg)}${tab("all","Todos os temas",null)}</div>
  ${list.length?`<div class="tw"><table class="conv"><thead><tr><th>Tema</th><th>Comunidade · Q1</th><th>ACS · Q2</th><th>Equipe · Q3</th><th>Leitura</th></tr></thead><tbody>${list.map(r=>`<tr><td class="name">${esc(r.label)}<br><small class="sub" style="font-weight:400">${esc(r.cat)}</small></td><td>${cmpCell(r.p1,0,"var(--q1)")}</td><td>${cmpCell(r.p2,r.u2,"var(--q2)")}</td><td>${cmpCell(r.p3,r.u3,"var(--q3)")}</td><td>${chip(r)}</td></tr>`).join("")}</tbody></table></div>`
   :`<div class="empty-mini">Nenhum tema com desencontro forte nesta direção.</div>`}`;
}
function scatter(C){
  const pts=MX.map(m=>({m,...C.q3m[m.id]})).filter(p=>p.f!=null&&p.i!=null);
  if(!pts.length)return`<div class="empty-mini">A matriz aparece quando houver respostas da equipe (Q3).</div>`;

  for(let v=1;v<=5;v++){g+=`<line x1="${x(v)}" x2="${x(v)}" y1="${T}" y2="${H-B}" stroke="var(--divider)"/><line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--divider)"/><text x="${x(v)}" y="${H-B+16}" font-size="11" text-anchor="middle">${v}</text><text x="${L-10}" y="${y(v)+4}" font-size="11" text-anchor="end">${v}</text>`}
  g+=`<text x="${(L+W-R)/2}" y="${H-6}" font-size="11" text-anchor="middle">Frequência na demanda</text><text transform="translate(12 ${(T+H-B)/2}) rotate(-90)" font-size="11" text-anchor="middle">Impacto do vídeo</text>`;
  const maxU=Math.max(1,...pts.map(p=>p.u)),placed=[],hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
  let dots="",labs="";
  pts.sort((a,b)=>b.score-a.score).forEach(p=>{const cx=x(p.f),cy=y(p.i),rr=4+p.u/maxU*6;p.cx=cx;p.cy=cy;p.rr=rr;placed.push({x:cx-rr,y:cy-rr,w:2*rr,h:2*rr})});
  pts.forEach(p=>{const t=SHORT[p.m.id],w=t.length*5.4+2;
    dots=`<circle cx="${p.cx}" cy="${p.cy}" r="${p.rr}" fill="var(--q3)" fill-opacity=".85" stroke="var(--card)" stroke-width="1.5"><title>${esc(p.m.label)}: F ${p.f.toFixed(1)}, I ${p.i.toFixed(1)}, ${p.u} urgência(s)</title></circle>`+dots;
    for(const side of [1,-1,0]){if(side===0)break;const bx=side>0?p.cx+p.rr+3:p.cx-p.rr-3-w,box={x:bx,y:p.cy-6,w,h:12};
      if(bx<L||bx+w>W-R)continue;if(placed.some(o=>hit(o,box)&&!(o.x===p.cx-p.rr&&o.y===p.cy-p.rr)))continue;
      placed.push(box);labs+=`<text x="${bx}" y="${p.cy+3.5}" font-size="9.5" style="fill:var(--body)">${esc(t)}</text>`;break}});
  g+=dots+labs;
  return`<div class="scatter"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Matriz frequência por impacto">${g}</svg></div>`;
}

  else if(f.type==="tcl")b=`<div class="tcl">${f.labels.map((l,i)=>`<div class="lbl">${esc(l)}</div><div class="tc"><input class="inp" id="${id}-${i}">${macroSel(`${id}-${i}-c`)}</div>`).join("")}</div>`;
  else if(f.type==="multi")b=f.labels.map((l,i)=>`<div class="row"><span>${esc(l)}</span><input class="inp" id="${id}-${i}"></div>`).join("");

  else if(f.type==="matrix")b=`<div class="mxnote"><p><b>Como responder.</b> Dê duas notas por tema, de 1 a 5. <b>Frequência na demanda:</b> 1 = quase nunca aparece no meu atendimento, 5 = aparece o tempo todo. <b>Potencial educativo:</b> 1 = um vídeo ajudaria pouco, 5 = ajudaria muito.</p><p><b>Tema que não é da sua prática?</b> Clique no <b>×</b> da linha. Vale para o tema que não faz parte do seu trabalho (um dentista e planejamento familiar, por exemplo), que você prefere não avaliar ou que não sabe responder. O tema sai do cálculo e <b>não conta como nota baixa</b>. Se você preferir avaliar mesmo assim, porque enxerga a necessidade, dê as notas normalmente.</p><p><b>Use a escala toda.</b> Evite dar 5 (ou 1) para todos os temas: se tudo é prioridade, nada se destaca. Compare os temas entre si e deixe notas altas só para os que mais precisam.</p></div><div class="tw"><table class="mx"><thead><tr><th>Tema<small>× corta o tema (não se aplica)</small></th><th>Frequência<small>1 quase nunca<br>5 o tempo todo</small></th><th>Potencial educativo<small>1 ajudaria pouco<br>5 ajudaria muito</small></th></tr></thead><tbody>${MX.map(m=>`<tr data-mxr="${m.id}"><td><div class="mxlab"><button type="button" class="mxna" data-na="${m.id}" aria-pressed="false" title="Não faz parte da minha prática, prefiro não avaliar ou não sei responder" aria-label="Não se aplica: ${esc(m.label)}">×</button><span>${esc(m.label)}</span></div></td>${["f","i"].map(k=>`<td style="text-align:center"><span class="seg ${k}">${[1,2,3,4,5].map(v=>`<label><input type="radio" name="mx-${m.id}-${k}" value="${v}" id="mx-${m.id}-${k}-${v}" aria-label="${esc(m.label)} ${k==="f"?"frequência na demanda":"potencial educativo"} ${v}"><span>${v}</span></label>`).join("")}</span></td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  if(f.nao)b+=`<div class="pills naow"><label class="pill"><input type="checkbox" id="${id}-nao" data-nao="${id}"><span>${esc(f.nao)}</span></label></div>`;

function mxSetNa(id,on){const row=document.querySelector(`tr[data-mxr="${id}"]`);if(!row)return;row.classList.toggle("na",on);const b=row.querySelector(".mxna");if(b)b.setAttribute("aria-pressed",on?"true":"false");

function abisProblemas(q){return[0,1,2].map(i=>(document.getElementById(`f-${q}-q3-${i}`)?.value||"").trim())}
function abisSync(q,f){const ta=document.getElementById(`f-${q}-${f.k}-ta`);if(!ta)return;S.abis=S.abis||{};S.abisAtivo=S.abisAtivo||{};const a=S.abisAtivo[q];if(a==null)return;S.abis[q]=S.abis[q]||{};S.abis[q][a]=ta.value}
function abisDraw(q,f){const id=`f-${q}-${f.k}`,box=document.getElementById(id+"-chips"),ta=document.getElementById(id+"-ta");if(!box||!ta)return;
  S.abis=S.abis||{};S.abis[q]=S.abis[q]||{};S.abisAtivo=S.abisAtivo||{};const d=S.abis[q],pr=abisProblemas(q);let a=S.abisAtivo[q];
  const chips=pr.map((p,i)=>({i,l:p||`Problema ${i+1} (não digitado)`,off:!p})).concat([{i:"x",l:"Outro problema",off:false}]);
  if(a!=null&&chips.find(c=>c.i===a&&c.off))a=null;
  box.innerHTML=chips.map(c=>`<button type="button" class="abchip ${a===c.i?"on":""} ${(d[c.i]||"").trim()?"done":""}" data-ab="${c.i}" ${c.off?"disabled":""}>${(d[c.i]||"").trim()?"✓ ":""}${esc(c.l)}</button>`).join("");
  if(a==null){ta.hidden=true;ta.value=""}else{ta.hidden=false;ta.value=d[a]||"";ta.placeholder=a==="x"?"Qualquer outro problema em que os pacientes chegam mal informados, e por quê.":"Neste problema, o que os pacientes sabem de errado ou deixam de saber, e por que isso acontece na prática?"}
  S.abisAtivo[q]=a;
  box.querySelectorAll("[data-ab]").forEach(b=>b.onclick=()=>{abisSync(q,f);const v=b.dataset.ab;S.abisAtivo[q]=v==="x"?"x":+v;abisDraw(q,f);if(!ta.hidden)ta.focus();updateSaveState(q)});
  ta.oninput=()=>{abisSync(q,f);const cur=S.abisAtivo[q];const b=box.querySelector(`[data-ab="${cur}"]`);if(b){const has=ta.value.trim();b.classList.toggle("done",!!has);b.textContent=(has?"✓ ":"")+(chips.find(c=>String(c.i)===String(cur))||{}).l}updateSaveState(q)}}
function readForm(q){
  const o={},val=id=>(document.getElementById(id)?.value||"").trim();
  o.code=val(`${q}-code`);o.data=val(`${q}-data`);if(q==="q1")o.coleta=val("q1-coleta");else{o.resp=val(`${q}-resp`);if(o.resp==="__outro__")o.resp=val("q3-respOutro")}
  SCHEMA[q].parts.forEach(p=>p.f.forEach(f=>{const id=`f-${q}-${f.k}`;
    if(f.type==="radio")o[f.k]=document.querySelector(`input[name="${id}"]:checked`)?.value||"";
    else if(f.type==="checks"||f.type==="groups"){o[f.k]=[...document.querySelectorAll(`input[name="${id}"]:checked`)].map(i=>i.value);if(f.urgent)o[f.k+"U"]=[...document.querySelectorAll(`input[name="${id}-u"]:checked`)].map(i=>i.value)}
    else if(f.type==="abismo"){abisSync(q,f);const d=(S.abis&&S.abis[q])||{};const pr=abisProblemas(q);const itens=pr.map((p,i)=>({p,t:(d[i]||"").trim()})).filter(x=>x.p||x.t);if((d.x||"").trim())itens.push({p:"Outro problema",t:d.x.trim()});
      o[f.k+"d"]=itens;o[f.k]=itens.filter(x=>x.t).map(x=>`${x.p}: ${x.t}`).join("\n\n")}
    else if(f.type==="ta")o[f.k]=val(id);
    else if(f.type==="tc"){o[f.k]=val(id);o[f.k+"c"]=val(id+"-c")}
    else if(f.type==="tcl")o[f.k]=f.labels.map((_,i)=>({t:val(`${id}-${i}`),c:val(`${id}-${i}-c`)}));
    else if(f.type==="multi")o[f.k]=f.labels.map((_,i)=>val(`${id}-${i}`));
    else if(f.type==="vocab")o[f.k]=Object.fromEntries(VOCAB.map((v,i)=>[v,val(`${id}-${i}`)]));
    else if(f.type==="matrix"){o.mx={};MX.forEach(m=>{if(document.querySelector(`tr[data-mxr="${m.id}"]`)?.classList.contains("na")){o.mx[m.id]={na:true};return}const fv=document.querySelector(`input[name="mx-${m.id}-f"]:checked`)?.value,iv=document.querySelector(`input[name="mx-${m.id}-i"]:checked`)?.value;if(fv||iv)o.mx[m.id]={f:fv?+fv:null,i:iv?+iv:null}})}
    if(f.nao){const nb=document.getElementById(id+"-nao");o[f.k+"nao"]=!!(nb&&nb.checked);if(o[f.k+"nao"]){o[f.k]="";if(f.type==="tc")o[f.k+"c"]=""}}
    if(f.other)o[f.other]=val(`${q}-${f.other}`);
  }));return o;
}
function fillForm(q,r){
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.value=v??""};
  set(`${q}-code`,r.code);set(`${q}-data`,r.data||today());if(q==="q1")set("q1-coleta",r.coleta);else{const known=!r.resp||r.resp===ANON||(q==="q2"?ACS_NAMES:ALL_STAFF).includes(r.resp);set(`${q}-resp`,known?r.resp:"__outro__");if(q==="q3"){set("q3-respOutro",known?"":r.resp);const ro=document.getElementById("q3-respOutro");if(ro)ro.hidden=known}}
  SCHEMA[q].parts.forEach(p=>p.f.forEach(f=>{const id=`f-${q}-${f.k}`;
    if(f.type==="radio")document.querySelectorAll(`input[name="${id}"]`).forEach(i=>i.checked=i.value===r[f.k]);
    else if(f.type==="checks"||f.type==="groups"){document.querySelectorAll(`input[name="${id}"]`).forEach(i=>i.checked=(r[f.k]||[]).includes(i.value));if(f.urgent)document.querySelectorAll(`input[name="${id}-u"]`).forEach(i=>i.checked=(r[f.k+"U"]||[]).includes(i.value))}
    else if(f.type==="ta")set(id,r[f.k]);
    else if(f.type==="tc"){set(id,r[f.k]);set(id+"-c",r[f.k+"c"])}
    else if(f.type==="tcl")f.labels.forEach((_,i)=>{const x=(r[f.k]||[])[i]||{};set(`${id}-${i}`,x.t);set(`${id}-${i}-c`,x.c)});
    else if(f.type==="multi")f.labels.forEach((_,i)=>set(`${id}-${i}`,(r[f.k]||[])[i]));
    else if(f.type==="abismo"){const pr=(r.q3||[]).map(x=>(x||"").trim());S.abis=S.abis||{};const d={};const it=r[f.k+"d"];
      if(Array.isArray(it)){it.forEach(x=>{const i=pr.findIndex(y=>y&&y===x.p);if(i>=0)d[i]=x.t;else if(x.t)d.x=(d.x?d.x+"\n":"")+(x.p&&x.p!=="Outro problema"?x.p+": ":"")+x.t})}else if(r[f.k])d.x=r[f.k];
      S.abis[q]=d;S.abisAtivo=S.abisAtivo||{};S.abisAtivo[q]=null;abisDraw(q,f)}
    else if(f.type==="vocab")VOCAB.forEach((v,i)=>set(`${id}-${i}`,(r[f.k]||{})[v]));
    else if(f.type==="matrix")MX.forEach(m=>{const v=(r.mx||{})[m.id]||{};mxSetNa(m.id,!!v.na);if(!v.na)["f","i"].forEach(k=>document.querySelectorAll(`input[name="mx-${m.id}-${k}"]`).forEach(i=>i.checked=+i.value===v[k]))});
    if(f.nao){const nb=document.getElementById(id+"-nao");if(nb){nb.checked=!!r[f.k+"nao"];naoApply(id)}}
    if(f.other)set(`${q}-${f.other}`,r[f.other]);
  }));enforceMax();updateSaveState(q);
}
function naoApply(id){const nb=document.getElementById(id+"-nao");if(!nb)return;const on=nb.checked;
  [id,id+"-c"].forEach(i=>{const e=document.getElementById(i);if(e){if(on)e.value="";e.disabled=on}})}
document.addEventListener("change",e=>{const t=e.target;if(t&&t.dataset&&t.dataset.nao){naoApply(t.dataset.nao);if(typeof updateSaveState==="function"){const m=/^f-(q\d)-/.exec(t.dataset.nao);if(m)updateSaveState(m[1])}}});
function nextCode(q){const p=SCHEMA[q].prefix;const n=Math.max(0,...S[q].map(r=>parseInt(String(r.code||"").replace(/\D/g,""))||0));return p+String(n+1).padStart(2,"0")}
function enforceMax(){
  document.querySelectorAll(".pills[data-max]").forEach(p=>{const m=+p.dataset.max;if(!m)return;const ins=[...p.querySelectorAll("input")];const c=ins.filter(i=>i.checked).length;ins.forEach(i=>i.disabled=!i.checked&&c>=m)});
  document.querySelectorAll(".pills[data-pg]").forEach(p=>{const m=+p.dataset.pg;const ins=[...p.querySelectorAll("input.it")];const c=ins.filter(i=>i.checked).length;ins.forEach(i=>i.disabled=!i.checked&&c>=m)});
  document.querySelectorAll(".groups[data-urg]").forEach(g=>{const m=+g.dataset.urg;const st=[...g.querySelectorAll("input.st")];
    st.forEach(s=>{const it=s.closest(".pw").querySelector("input.it");if(!it.checked)s.checked=false});
    const c=st.filter(s=>s.checked).length;st.forEach(s=>{const it=s.closest(".pw").querySelector("input.it");s.disabled=!it.checked||(!s.checked&&c>=m)});
    const n=g.querySelectorAll("input.it:checked").length,cnt=g.parentElement.querySelector("[id$='-cnt']");if(cnt)cnt.textContent=`${n} marcado${n===1?"":"s"} · ${c} de ${m} urgentes`})}
function fieldHas(f,r){if(f.nao&&r[f.k+"nao"])return true;const v=f.type==="matrix"?r.mx:r[f.k];if(Array.isArray(v))return v.some(x=>x&&(typeof x==="string"?x.trim():x.t));if(v&&typeof v==="object")return Object.values(v).some(Boolean);return!!(v&&String(v).trim())}
function fillInfo(q,r){let filled=0,total=0,own=0;SCHEMA[q].parts.forEach(p=>p.f.forEach(f=>{if(f.type==="meta")return;total++;if(fieldHas(f,r)){filled++;if(!(q==="q3"&&f.k==="area"))own++}}));return{filled,total,own,pct:total?Math.round(filled/total*100):0}}

function wireForm(q){
  const frm=$("#frm");
  SCHEMA[q].parts.forEach(p=>p.f.forEach(f=>{if(f.type==="abismo"){abisDraw(q,f);for(let i=0;i<3;i++){const e=document.getElementById(`f-${q}-q3-${i}`);if(e)e.addEventListener("input",()=>{abisSync(q,f);abisDraw(q,f)})}}}));

/* ---------------- CSV ---------------- */
function csvRows(q){
  const cols=[["Código",r=>r.code],["Data",r=>fmtDate(r.data)],["Aplicador",r=>r.aplicador||""],["% preenchido",r=>fillInfo(q,r).pct]];if(q==="q1")cols.push(["Coleta",r=>r.coleta]);
  SCHEMA[q].parts.forEach(p=>p.f.forEach(f=>{const L=`${f.n} ${f.short||f.label}`;
    if(f.type==="groups"){Q1ALL.forEach(t=>cols.push([`${f.n} ${t.label}`,r=>(r.temas||[]).includes(t.id)?1:0]));if(f.urgent)cols.push([`${f.n} mais urgentes`,r=>(r.temasU||[]).map(id=>Q1ALL.find(t=>t.id===id)?.label).filter(Boolean).join(" | ")])}
    else if(f.type==="checks")f.opts.forEach(o=>cols.push([`${f.n} ${o}`,r=>(r[f.k]||[]).includes(o)?1:0]));
    else if(f.type==="tc"){cols.push([L,r=>r[f.k+"nao"]?f.nao:r[f.k]]);cols.push([`${f.n} código`,r=>M[r[f.k+"c"]]?.label||""])}
    else if(f.type==="tcl")f.labels.forEach((l,i)=>{cols.push([`${f.n} ${l}`,r=>(r[f.k]||[])[i]?.t]);cols.push([`${f.n} ${l} código`,r=>M[(r[f.k]||[])[i]?.c]?.label||""])});
    else if(f.type==="multi")f.labels.forEach((l,i)=>cols.push([`${f.n} ${l}`,r=>(r[f.k]||[])[i]]));
    else if(f.type==="vocab")VOCAB.forEach(v=>cols.push([`7 ${v}`,r=>(r.q7||{})[v]]));
    else if(f.type==="matrix")MX.forEach(m=>{cols.push([`${m.label} F`,r=>r.mx?.[m.id]?.na?"n/a":r.mx?.[m.id]?.f]);cols.push([`${m.label} I`,r=>r.mx?.[m.id]?.na?"n/a":r.mx?.[m.id]?.i])});
    else if(f.type!=="meta")cols.push([L,r=>f.nao&&r[f.k+"nao"]?f.nao:r[f.k]]);
    if(f.other)cols.push([`${f.n} outra`,r=>r[f.other]]);
  }));
  const cell=v=>{const s=v==null?"":String(v);return/[";\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s};
  const arr=[...S[q]].sort((a,b)=>String(a.code).localeCompare(String(b.code),"pt",{numeric:true}));
  return"﻿"+[cols.map(c=>cell(c[0])).join(";"),...arr.map(r=>cols.map(c=>cell(c[1](r))).join(";"))].join("\r\n");
}

function completude(D){
  return["q1","q2","q3"].map(q=>{const recs=D[q],rows=[];SCHEMA[q].parts.forEach(p=>p.f.forEach(f=>{if(f.type==="meta")return;const has=r=>{if(f.nao&&r[f.k+"nao"])return true;const v=f.type==="matrix"?r.mx:r[f.k];if(Array.isArray(v))return v.some(x=>x&&(typeof x==="string"?x.trim():x.t));if(v&&typeof v==="object")return Object.values(v).some(Boolean);return!!(v&&String(v).trim())};
    rows.push({n:f.n,label:f.short||f.label,k:recs.filter(has).length})}));return{q,n:recs.length,rows}})}
function rankScatter(T,ra,rb,b){
  const n=T.length,W=360,H=300,L=36,R=12,Tp=10,B=34;
  const x=v=>L+(v-1)/(n-1)*(W-L-R),y=v=>Tp+(v-1)/(n-1)*(H-Tp-B);
  let g=`<line x1="${x(1)}" y1="${y(1)}" x2="${x(n)}" y2="${y(n)}" stroke="var(--border-strong)" stroke-dasharray="4 4"/>`;
  [1,10,20,30,40].filter(v=>v<=n).forEach(v=>{g+=`<text x="${x(v)}" y="${H-B+15}" font-size="10" text-anchor="middle">${v}º</text><text x="${L-6}" y="${y(v)+3}" font-size="10" text-anchor="end">${v}º</text>`});
  g+=`<text x="${(L+W-R)/2}" y="${H-4}" font-size="10.5" text-anchor="middle">Posição na comunidade (Q1)</text><text transform="translate(10 ${(Tp+H-B)/2}) rotate(-90)" font-size="10.5" text-anchor="middle">Posição ${SCHEMA[b].short}</text>`;
  const pts=T.map((t,i)=>({t,a:ra[i],b:rb[i],d:Math.abs(ra[i]-rb[i])}));const top=new Set(pts.slice().sort((p,q)=>q.d-p.d).slice(0,5).map(p=>p.t.id));
  const placed=pts.map(p=>({x:x(p.a)-4,y:y(p.b)-4,w:8,h:8})),hit=(a,c)=>a.x<c.x+c.w&&a.x+a.w>c.x&&a.y<c.y+c.h&&a.y+a.h>c.y;let labs="";
  pts.forEach(p=>{g+=`<circle cx="${x(p.a)}" cy="${y(p.b)}" r="${top.has(p.t.id)?4.5:3.2}" fill="${top.has(p.t.id)?`var(--${b})`:"var(--muted)"}" fill-opacity="${top.has(p.t.id)?1:.55}"><title>${esc(p.t.rotulo)}: ${Math.round(p.a)}º na comunidade, ${Math.round(p.b)}º ${SCHEMA[b].short}</title></circle>`});
  pts.filter(p=>top.has(p.t.id)).sort((p,q)=>q.d-p.d).forEach(p=>{const t=p.t.rotulo.split(":")[0].slice(0,22),w=t.length*5.2+2,cx=x(p.a),cy=y(p.b);
    for(const [dx,dy] of [[7,3.5],[-7-w,3.5],[-w/2,-8],[-w/2,15]]){const box={x:cx+dx,y:cy+dy-9,w,h:11};if(box.x<L||box.x+w>W-R||box.y<Tp-2||box.y+11>H-B+2)continue;if(placed.some(o=>hit(o,box)&&!(Math.abs(o.x+4-cx)<.1&&Math.abs(o.y+4-cy)<.1)))continue;placed.push(box);labs+=`<text x="${box.x}" y="${cy+dy}" font-size="9.5" style="fill:var(--body)">${esc(t)}</text>`;break}});
  return`<div class="scatter"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Posição dos temas nos rankings">${g}${labs}</svg></div>`;
}

function satCurve(c){if(c.length<3)return`<div class="empty-mini">Precisa de mais unidades codificadas.</div>`;const W=640,H=200,L=36,R=12,T=12,B=30,n=c.length,mx=Math.max(...c);const x=i=>L+i/(n-1)*(W-L-R),y=v=>T+(1-v/mx)*(H-T-B);
  const d=c.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" ");
  let g=`<path d="${d} L${x(n-1)} ${y(0)} L${x(0)} ${y(0)} Z" fill="var(--brand-soft)"/><path d="${d}" fill="none" stroke="var(--brand)" stroke-width="2"/><circle cx="${x(n-1)}" cy="${y(c[n-1])}" r="4" fill="var(--brand)"/>`;
  [0,.5,1].forEach(p=>{const v=Math.round(mx*p);g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--divider)"/><text x="${L-6}" y="${y(v)+4}" font-size="10" text-anchor="end">${v}</text>`});
  g+=`<text x="${x(0)}" y="${H-10}" font-size="10">1</text><text x="${x(n-1)}" y="${H-10}" font-size="10" text-anchor="end">${n} unidades</text><text x="${x(n-1)-10}" y="${y(c[n-1])+18}" font-size="11" text-anchor="end" font-weight="600" style="fill:var(--heading)">${c[n-1]} códigos</text>`;
  return`<div class="scatter"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva de saturação">${g}</svg></div>`}

   </div><div><span class="lab">Falas âncora (até 5)</span><div class="anch">${cand.slice(0,30).map(u=>`<label class="aq"><input type="checkbox" data-q="${esc(u.key)}" ${q.has(u.key)?"checked":""}><span><span class="src ${u.src}">${u.src} · ${esc(u.rcode)}</span> ${esc(u.t)}</span></label>`).join("")||'<div class="empty-mini">Ligue códigos à ficha para ver as falas.</div>'}</div></div></div>
   <datalist id="codeList2">${T.codes.map(c=>`<option value="${esc(c.name)}"></option>`).join("")}</datalist></section>`}
async function draftFicha(id,btn){if(!guardWrite())return;const T=TA(),f=T.temas.find(t=>t.id===id);const ids=new Set(f.codes||[]);const quotes=T.units.filter(u=>finalCodes(T,u.key).some(x=>ids.has(x))).slice(0,40);
  if(!quotes.length){toast("Ligue códigos com falas a esta ficha primeiro.");return}const sample=await claude.use("sample");if(!sample){toast("Indisponível nesta visualização.");return}
  btn.disabled=true;const old=btn.innerHTML;btn.textContent="Rascunhando…";
  const prompt=`Projeto Fio a Fio, Centro de Saúde Monte Serrat (Florianópolis): vídeos curtos de educação em saúde para a sala de espera, construídos pela Codificação Dialógica de base freireana.
Tema gerador em construção: "${f.titulo}". Códigos: ${(f.codes||[]).map(x=>codeById(T,x)?.name).filter(Boolean).join("; ")}.
Falas que sustentam o tema (Q1 pacientes, Q2 ACS, Q3 equipe):
${quotes.map(u=>`- [${u.src}] ${u.t}`).join("\n")}

Com base apenas nessas falas, rascunhe os elementos da ficha. Português do Brasil, frases curtas, sem travessões, linguagem do território e sem tom de bronca.
Responda só com JSON: {"titulo":"","situacao":"","mito":"","inedito":"","metafora":"","cena":""}`;
  try{const r=await sample.json(prompt);const body={};["titulo","situacao","mito","inedito","metafora","cena"].forEach(k=>{if(r&&r[k]&&!(f[k]||"").trim())body[k]=String(r[k])});if(r&&r.titulo&&f.titulo===(f.cat||"Novo tema gerador"))body.titulo=String(r.titulo);
    if(Object.keys(body).length){await S.db.collection("temas").doc(id).update(body);toast("Rascunho preenchido nos campos vazios. Revise.")}else toast("Os campos já estavam preenchidos.")}
  catch(e){toast("Não foi possível rascunhar agora.")}btn.disabled=false;btn.innerHTML=old;icons()}
async function exportTA(){
  const T=TA(),dl=await claude.use("downloads");if(!dl){toast("Exportação indisponível nesta visualização.");return}
  const cell=v=>{const s=v==null?"":String(v);return/[";\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s};
  const book=[["Código","Definição","Categoria","Unidades","Q1","Q2","Q3"]],st=codeStats(T);T.codes.forEach(c=>book.push([c.name,c.def,c.cat,st[c.id].n,st[c.id].Q1,st[c.id].Q2,st[c.id].Q3]));
  const coded=[["Escuta","Questionário","Núcleo","Fala","Códigos finais","Categorias"]];T.units.forEach(u=>{const ids=finalCodes(T,u.key);coded.push([u.src,u.rcode,NUC[u.nuc],u.t,ids.map(id=>codeById(T,id)?.name).filter(Boolean).join(" | "),[...new Set(ids.map(id=>codeById(T,id)?.cat).filter(Boolean))].join(" | ")])});
  const md=T.temas.map(f=>`## ${f.titulo}\n\n- **Status:** ${f.status||""}\n- **Macro-tema:** ${M[f.macro]?.label||""}\n- **Códigos:** ${(f.codes||[]).map(id=>codeById(T,id)?.name).filter(Boolean).join(", ")}\n- **Situação-limite:** ${f.situacao||""}\n- **Mito a desarmar:** ${f.mito||""}\n- **Inédito viável:** ${f.inedito||""}\n- **Signo mediador:** ${f.metafora||""}\n- **Cena de codificação:** ${f.cena||""}\n\n**Falas âncora**\n\n${(f.quotes||[]).map(k=>{const u=T.units.find(x=>x.key===k);return u?`> "${u.t}" (${u.src}, ${u.rcode})`:""}).filter(Boolean).join("\n\n")}\n`).join("\n");
  try{await dl.save({filename:`FioAFio_livro_de_codigos_${today()}.csv`,data:"﻿"+book.map(r=>r.map(cell).join(";")).join("\r\n")});
    await dl.save({filename:`FioAFio_unidades_codificadas_${today()}.csv`,data:"﻿"+coded.map(r=>r.map(cell).join(";")).join("\r\n")});
    if(T.temas.length)await dl.save({filename:`FioAFio_temas_geradores_${today()}.md`,data:`# Temas geradores · Projeto Fio a Fio\n\n${md}`});toast("Arquivos exportados")}catch(e){if(e&&e.code!=="declined")toast("Não foi possível exportar.")}
}

const TUT={
 panorama:{title:"Panorama",go:"panorama",lead:"O panorama é a triagem: mostra, de forma rápida e visual, quais temas aparecem nas três escutas. Ele não testa hipóteses. Use para orientar a conversa com a equipe e para decidir onde olhar com mais cuidado na estatística e na análise temática.",
 items:[
  {t:"Contadores do topo",in:"Número de questionários salvos de pacientes (Q1), ACS (Q2) e equipe (Q3). No Q3, as respostas da pergunta 13 (quem topa revisar roteiro).",
   read:"A barra dos pacientes compara o total com a meta mínima de 50 respostas, sugerida no protocolo (Taylor e Haley recomendam de 30 a 50 em levantamentos rápidos na atenção primária). ACS e equipe são censos: as barras mostram a taxa de resposta sobre os 9 ACS e os 31 profissionais do CS, com mínimo recomendado de 75% (7 ACS e 23 profissionais). O cartão de temas convergentes diz quantos dos 18 macro-temas acenderam os três fios.",
   int:"Antes de uns 30 pacientes, o ranking ainda muda muito a cada questionário novo. Acompanhe, mas evite decidir temas antes disso.",
   warn:"O cartão de convergência depende de haver respostas nos três grupos. Com um grupo vazio, nenhum tema chega a três fios."},
  {t:"Temas convergentes",in:"Por macro-tema. Q1: proporção de pacientes que marcou pelo menos um tema daquele macro-tema na pergunta 4, mais os pedidos de vídeo (pergunta 10) que você classificou. Q2: proporção de ACS que marcou o macro-tema na lista (pergunta 4) e quantas estrelas de urgência recebeu. Q3: média de frequência multiplicada pela média de impacto na matriz (pergunta 7).",
   read:"Cada escuta acende um fio quando o macro-tema fica acima da média daquela escuta entre os 18 macro-temas. Três fios: Convergente. Dois: Forte. Um: Parcial. A tabela já vem ordenada pelos mais convergentes.",
   int:"Convergente é o candidato natural aos primeiros vídeos: a comunidade pede, o território confirma e a clínica vê impacto. Um fio só também interessa. Se só a equipe acende, é uma necessidade que a comunidade ainda não percebe; se só a comunidade acende, é uma demanda que o serviço talvez não esteja vendo.",
   warn:"É uma regra de triagem relativa, não um teste estatístico. Macro-temas com muitos itens na lista (Saúde bucal tem 7, Saúde mental tem 5) têm mais chance de alguém marcar pelo menos um. Confirme na comparação tema a tema e na estatística. Se muitas respostas forem classificadas como \"Outro / não mapeado\", talvez falte um macro-tema."},
  {t:"Comparação das três escutas",in:"Pergunta 4 do Q1 e do Q2 e pergunta 5 do Q3, tema a tema (41 temas). Nos ACS e na equipe, a estrela conta quantos apontaram o tema entre os 3 mais urgentes.",
   read:"As porcentagens são de quem marcou o tema em cada grupo. Para comparar, o painel usa a posição relativa: a porcentagem do tema dividida pela do tema mais marcado daquele grupo. Quando a posição relativa de ACS e equipe passa a da comunidade em 0,35 ou mais (ou o contrário), o tema aparece num dos dois filtros.",
   int:"\"Equipe vê, comunidade não pede\": necessidade não percebida. Pede um vídeo que desperte curiosidade e problematize, partindo de uma situação reconhecível. \"Comunidade pede, equipe não vê\": demanda não vista. Vale levar para a reunião de equipe: pode ser lacuna do serviço, e o vídeo pode responder diretamente à pergunta da comunidade.",
   warn:"Pacientes marcam à vontade e ACS e equipe marcam até 2 por grupo. Por isso a comparação é de posição, nunca de porcentagem bruta. Com poucos ACS, um único ACS muda bastante o resultado."},
  {t:"O que a comunidade quer entender",in:"Pergunta 4 do Q1.",read:"Os 15 temas mais marcados pelos pacientes, com o número e a porcentagem de respondentes.",int:"É a voz da comunidade sem mediação. Os primeiros temas costumam ser os de maior adesão na sala de espera.",warn:"Não mostra incerteza. Para saber se um tema é de fato mais citado que outro, use os intervalos de confiança na Estatística."},
  {t:"Matriz da equipe",in:"Pergunta 7 do Q3 (frequência e impacto de 1 a 5 por macro-tema) e as estrelas de urgência da pergunta 5.",read:"Cada ponto é um macro-tema. Para a direita, mais frequente na demanda; para cima, maior o potencial educativo. Quem marcou × no tema (fora da prática, prefere não avaliar ou não sabe) fica fora da média daquele tema. Ponto maior: mais estrelas de urgência. A área destacada reúne os temas frequentes e de alto impacto.",int:"Temas na área destacada são prioridade clínica. Um tema de alto impacto e baixa frequência pode valer um vídeo preventivo.",warn:"São médias. Se a equipe discordar muito entre si, a média esconde isso: veja os intervalos de confiança na Estatística."},
  {t:"Atenção à TV, formato e quem respondeu",in:"Perguntas 1, 2, 8 e 9 do Q1.",read:"Distribuição das respostas com número e porcentagem.",int:"Atenção à TV e formato orientam o jeito do vídeo (duração, animação, depoimentos). O perfil mostra quem a amostra representa.",warn:"Se quase só mulheres ou só uma faixa de idade responderam, os resultados refletem esse grupo. Vale buscar respondentes que faltam antes de fechar a coleta."},
  {t:"Barreiras e obstáculos",in:"Pergunta 9 do Q2 (por que não buscam o CS) e pergunta 8 do Q3 (obstáculos ao autocuidado).",read:"Quantos ACS ou profissionais marcaram cada opção.",int:"Alimentam os muros, as situações-limite dos roteiros. Uma barreira muito citada pode virar o conflito central de um vídeo.",warn:"Os grupos são pequenos: leia como tendência."}
 ]},
 estatistica:{title:"Estatística",go:"stats",lead:"A estatística confirma, ou não, o que o panorama sugere, mostrando a incerteza de cada número. Como a amostra é de conveniência e os grupos são pequenos, todos os testes são exploratórios: apontam padrões, não generalizam para a população.",
 concepts:[["p-valor","Probabilidade de ver uma diferença igual ou maior que a observada se, na verdade, não houvesse diferença nenhuma. Abaixo de 0,05, dizemos que o resultado é estatisticamente significativo. Na página, esses resultados aparecem em negrito."],
  ["IC 95%","Intervalo de confiança: a faixa de valores plausíveis para a proporção ou média real. Intervalo largo significa pouca informação (poucos respondentes)."],
  ["q (correção)","Quando se fazem muitos testes ao mesmo tempo (41 temas), alguns dão p < 0,05 por acaso. O q de Benjamini-Hochberg corrige isso. Linhas com fundo destacado continuam significativas depois da correção, e são as mais confiáveis."],
  ["Significativo não é importante","Uma diferença pode ser significativa e pequena, ou grande e não significativa por falta de gente. Olhe sempre o tamanho da diferença junto com o p."]],
 items:[
  {t:"Proporção que marcou cada tema",in:"Pergunta 4 (Q1 e Q2) ou pergunta 5 (Q3), para o grupo escolhido. Nos grupos Q2 e Q3, a coluna ★ conta as estrelas de urgência.",
   read:"n é quantos marcaram; % é a proporção; o IC 95% é calculado pelo método de Wilson, o mais indicado para amostras pequenas. No gráfico, o ponto é a porcentagem e a faixa clara é o intervalo.",
   int:"Se os intervalos de dois temas não se sobrepõem, há boa evidência de que um é mais citado que o outro. Se se sobrepõem bastante, não dá para afirmar diferença: trate como empatados.",
   ex:"\"Ansiedade e estresse: 59% (IC 95%: 44% a 72%)\" quer dizer que, entre os pacientes, a proporção real que quer entender o tema provavelmente está entre 44% e 72%.",
   warn:"Em Q2 e Q3 cada pessoa marca até 2 por grupo, então as porcentagens não se comparam diretamente com as do Q1."},
  {t:"Concordância entre as escutas",in:"A proporção de cada um dos 41 temas em cada grupo.",
   read:"ρ de Spearman compara a ordem de prioridade de dois grupos: vai de -1 (ordens opostas) a 1 (mesma ordem). Força: abaixo de 0,1 desprezível, até 0,3 fraca, até 0,5 moderada, até 0,7 forte, acima disso muito forte. O W de Kendall faz o mesmo para os três grupos juntos e vai de 0 (nenhuma concordância) a 1 (total). Linhas em negrito têm p < 0,05: a concordância não é obra do acaso.",
   int:"Concordância forte: as escutas veem prioridades parecidas, e os temas convergentes são seguros. Concordância fraca: cada grupo prioriza coisas diferentes, o que é um achado em si e um ótimo ponto de partida para o diálogo na equipe. Nos gráficos, a diagonal tracejada é a mesma posição nos dois rankings; pontos longe dela são os maiores desencontros.",
   ex:"Para relatar: \"A ordem de prioridade dos temas teve concordância moderada entre pacientes e equipe (ρ = 0,42; p = 0,006)\".",
   warn:"Precisa de respostas em pelo menos dois grupos. Compara ordens, por isso é válida mesmo com regras de marcação diferentes."},
  {t:"Diferenças por perfil dos pacientes",in:"Q1: pergunta 4 cruzada com faixa etária, gênero (feminino x masculino), tempo no território ou atenção à TV.",
   read:"As colunas mostram a porcentagem que marcou o tema em cada categoria. O teste exato de Fisher é usado em gênero (tabela 2×2) e o qui-quadrado nas demais. Aparecem os 15 temas com menor p. Em negrito: p < 0,05. Fundo destacado: q < 0,05.",
   int:"Fundo destacado é uma diferença robusta: vale considerar vídeos ou linguagem diferentes para aquele público. Negrito sem fundo é indício: a diferença pode ser real, mas também pode ser efeito de testar 41 temas; trate como hipótese para a análise qualitativa.",
   ex:"Se \"Câncer de próstata\" aparece com 53% entre homens e 12% entre mulheres, com fundo destacado, há diferença consistente entre os gêneros nesse tema.",
   warn:"\"Esperados < 5\" indica que o qui-quadrado é pouco confiável com tão pouca gente por célula. Associação não é causa. Gênero inclui só feminino e masculino; as outras respostas ficam de fora deste teste."},
  {t:"Quantos temas cada paciente marcou",in:"Número de itens marcados na pergunta 4 por paciente.",
   read:"Média e desvio padrão (DP); mediana e intervalo interquartil (IIQ, onde ficam os 50% do meio); IC 95% da média. A tabela mostra a mediana por faixa etária, e o teste de Kruskal-Wallis compara as faixas. Fica em negrito se p < 0,05.",
   int:"Mediana muito diferente da média indica distribuição assimétrica; nesse caso, relate a mediana. Kruskal-Wallis significativo quer dizer que pelo menos uma faixa marca mais ou menos temas, sem dizer qual: olhe a tabela.",
   warn:"Marcar muitos temas pode indicar interesse real ou pouca discriminação. Combine com as estrelas e com os pedidos de vídeo."},
  {t:"Matriz da equipe",in:"Pergunta 7 do Q3.",read:"Para frequência e potencial educativo: média, IC 95% (pela distribuição t) e mediana. Ordenado pelo produto das médias. A coluna n mostra quantos profissionais entraram em cada tema, e a coluna Fora da prática quantos o cortaram com ×.",int:"Intervalos estreitos mostram que a equipe concorda; intervalos largos, que discorda. Discordância grande merece conversa antes de decidir o tema.",warn:"Com poucos profissionais, prefira a mediana e não leia diferenças pequenas entre médias. Temas com muitos cortes têm n pequeno: leia com cautela."},
  {t:"Proporções de TV, formato, barreiras e obstáculos",in:"Q1 perguntas 8 e 9; Q2 pergunta 9; Q3 pergunta 8.",read:"Como na tabela de temas: n, %, IC 95% de Wilson.",int:"Use os intervalos para dizer com honestidade o quanto se sabe. Ex.: \"46% prestam atenção à TV às vezes (IC 95%: 32% a 60%)\".",warn:"No formato preferido cada pessoa marca até 2, então a soma passa de 100%."},
  {t:"Completude das respostas",in:"Todas as perguntas dos três questionários.",read:"Porcentagem de questionários com cada pergunta respondida. Barras vermelhas: menos da metade respondeu.",int:"Pergunta muito vazia pode estar confusa, longa demais ou constrangedora. Relate a falta e evite tirar conclusões dela.",warn:"Pergunta aberta vazia nem sempre é falha: às vezes a pessoa não tinha o que dizer."},
  {t:"Texto para métodos e exportação",in:"As análises da página.",read:"O rascunho descreve os testes usados com o n atual. \"Exportar tabelas\" gera um CSV que abre no Excel com todas as tabelas, IC, p e q.",int:"Revise o texto, inclua período e local de coleta e cite os métodos: Wilson (1927), Spearman, Kendall, Fisher, qui-quadrado de Pearson, Kruskal-Wallis e Benjamini e Hochberg (1995).",warn:"O texto muda conforme os dados. Copie a versão final só quando a coleta terminar."}
 ]},
 tematica:{title:"Análise temática",go:"tema",lead:"A análise de conteúdo temática (Bardin; Minayo, na saúde coletiva) transforma as respostas abertas em núcleos de sentido, lidos pela lente de Paulo Freire: situações-limite, mitos, inédito viável, signos mediadores e cenas de codificação. É aqui que nascem os temas geradores e o roteiro dos vídeos.",
 concepts:[["Unidade de registro","Cada resposta aberta é uma unidade (uma fala). O painel junta as respostas dos três questionários e indica de onde vêm (Q1 · P07)."],
  ["Núcleo","A pergunta de origem da fala: mitos, muros, tabus, inédito viável, metáforas, cenas, território e outros. É a unidade de contexto."],
  ["Código","Etiqueta curta que descreve o sentido da fala, não só o assunto. \"Remédio só quando sente\" é um código; \"Hipertensão\" é um assunto."],
  ["Categoria","Agrupa códigos parecidos num núcleo de sentido maior, com um tipo freireano que liga a categoria ao roteiro."]],
 items:[
  {t:"1. Pré-análise: leitura flutuante",in:"Aba Falas.",read:"Leia todas as falas por núcleo, sem classificar. Anote palavras que se repetem, expressões da comunidade e surpresas.",int:"É o primeiro contato com o universo vocabular. As anotações viram os primeiros códigos.",warn:"Não pule esta etapa usando a proposta do Claude: ela empobrece a leitura."},
  {t:"2. Livro de códigos",in:"Aba Análise temática · Livro de códigos.",
   read:"Cada código tem nome, definição de quando aplicar, categoria e exemplo. A tabela mostra quantas unidades usam o código e de quais escutas vêm. \"Propor livro inicial\" pede ao Claude uma proposta, que você aprova ou não linha por linha.",
   int:"Um bom código é curto, descreve sentido e tem definição clara o bastante para outra pessoa aplicar igual. Use \"Fundir em\" quando dois códigos dizem a mesma coisa. Dê a cada categoria um tipo freireano: situação-limite, mito, inédito viável, signo mediador ou codificação.",
   warn:"O livro de códigos evolui durante a codificação. Quando mudar uma definição, revise as unidades que já usam aquele código."},
  {t:"3. Codificar",in:"Aba Codificar.",
   read:"Filtre por núcleo, escuta e situação. Digite um código e Enter; nome novo cria o código. \"Sugerir códigos\" pede ao Claude até 3 códigos para cada fala da tela, e você aceita (✓) ou recusa (✕) um a um, ou aceita todos da tela.",
   int:"Use de 1 a 3 códigos por unidade. Se uma fala não cabe em nenhum código, talvez ela revele um sentido novo: crie o código.",
   warn:"As sugestões do Claude são uma primeira leitura. A decisão é sempre de quem codifica, e isso deve constar no método."},
  {t:"4. Dupla codificação e concordância",in:"Aba Concordância. Precisa de duas pessoas codificando as mesmas unidades.",
   read:"Concordância exata: unidades com códigos idênticos. Jaccard: sobreposição parcial, de 0 a 1. Kappa de Cohen por código: concordância além do acaso. Leitura do kappa (Landis e Koch): até 0,20 leve, até 0,40 razoável, até 0,60 moderada, até 0,80 substancial, acima disso quase perfeita.",
   int:"Kappa abaixo de 0,6 num código indica definição ambígua: reescreva a definição e recodifique. As divergências aparecem em lista para registrar o consenso. O consenso passa a ser a codificação final da unidade; sem consenso, vale a união dos codificadores.",
   ex:"Para relatar: \"Duas pesquisadoras codificaram independentemente 30% do material; o kappa médio foi 0,72 (concordância substancial) e as divergências foram resolvidas por consenso\".",
   warn:"A segunda pessoa precisa codificar sem ver a primeira: deixe \"Mostrar outros codificadores\" desligado."},
  {t:"5. Triangulação",in:"Aba Triangulação. Usa a codificação final.",
   read:"Para cada categoria, quantas unidades de cada escuta foram codificadas nela e a proporção sobre as unidades codificadas daquele grupo. As linhas de baixo detalham por código. \"Nas três escutas\" marca as categorias presentes em pacientes, ACS e equipe.",
   int:"Categorias nas três escutas são os núcleos de sentido convergentes. Compare com os temas convergentes do panorama: quando o número e o sentido apontam na mesma direção, o tema está bem sustentado.",
   warn:"Os grupos têm tamanhos diferentes (há muito mais falas de pacientes). Por isso compare proporções, não contagens."},
  {t:"6. Saturação",in:"Aba Triangulação, gráfico de saturação.",read:"Códigos diferentes acumulados conforme as unidades são codificadas, em ordem de coleta.",int:"Quando a curva achata, novas falas quase não trazem sentidos novos: o material está saturado. Se ainda sobe no fim, vale continuar a coleta.",warn:"Depende da ordem de codificação. Codifique em ordem de coleta para que a curva tenha sentido."},
  {t:"7. Temas geradores",in:"Aba Temas geradores.",
   read:"Cada ficha junta uma categoria aos seus códigos, às falas que os sustentam e aos elementos do roteiro: situação-limite, mito a desarmar, inédito viável, signo mediador e cena de codificação. Ligar a um macro-tema mostra a convergência quantitativa do panorama. \"Rascunhar\" preenche os campos vazios a partir das falas.",

    catch(err){toast("Não foi possível gerar o backup. Confira a conexão e tente de novo.")}b.disabled=false};
  $("#rsFile").onchange=async e=>{const file=e.target.files[0];e.target.value="";const prev=$("#rsPrev"),info=$("#rsInfo");prev.innerHTML="";if(!file)return;info.textContent=file.name;
    let dados;try{dados=JSON.parse(await file.text())}catch(err){prev.innerHTML='<p class="gerr">Não consegui ler este arquivo. Ele precisa ser um backup em JSON baixado aqui.</p>';return}
    const nomes={q1:"Questionários Q1",q2:"Questionários Q2",q3:"Questionários Q3",codes:"Códigos",cats:"Categorias",cod:"Codificações",sug:"Sugestões do Claude",temas:"Fichas de temas geradores",links:"Links online"};
    const lin=Object.keys(nomes).filter(k=>Array.isArray(dados[k])&&dados[k].length).map(k=>({k,n:dados[k].filter(x=>x&&typeof x.id==="string"&&x.id).length,atual:(S[k]||[]).length}));
    if(!lin.length){prev.innerHTML='<p class="gerr">Este arquivo não tem registros que o site reconheça.</p>';return}
    const tot=lin.reduce((a,x)=>a+x.n,0);const quando=dados._meta&&dados._meta.geradoEm?new Date(dados._meta.geradoEm).toLocaleString("pt-BR"):"data não informada";
    prev.innerHTML=`<p class="sub" style="margin:12px 0 6px">Backup gerado em ${esc(quando)}. Conteúdo:</p><div class="tw"><table class="stt"><thead><tr><th>Coleção</th><th class="r">No arquivo</th><th class="r">Agora no site</th></tr></thead><tbody>${lin.map(x=>`<tr><td>${esc(nomes[x.k])}</td><td class="r num">${x.n}</td><td class="r num">${x.atual}</td></tr>`).join("")}</tbody></table></div>
      <label class="chk" style="display:flex;gap:8px;align-items:center;margin:10px 0"><input type="checkbox" id="rsPre" checked> Baixar um backup do estado atual antes de restaurar (recomendado)</label>
      <div class="actions"><button class="btn pri" id="rsGo"><i data-lucide="history"></i>Restaurar ${tot} registro${tot===1?"":"s"}</button><button class="btn ghost" id="rsNo">Cancelar</button></div>`;icons();
    $("#rsNo").onclick=()=>{prev.innerHTML="";info.textContent=""};
    $("#rsGo").onclick=async ev=>{const b=ev.currentTarget;if(!b.dataset.arm){b.dataset.arm="1";b.innerHTML="Confirmar restauração";b.classList.add("danger");setTimeout(()=>{if(b.isConnected&&b.dataset.arm){delete b.dataset.arm;b.classList.remove("danger");b.innerHTML=`<i data-lucide="history"></i>Restaurar ${tot} registro${tot===1?"":"s"}`;icons()}},5000);return}
      b.disabled=true;$("#rsNo").disabled=true;
      try{if($("#rsPre").checked){const atual=await FIO.backup();const dl=await claude.use("downloads");const ag=new Date(),pad=x=>String(x).padStart(2,"0");await dl.save({filename:`FioAFio_antes-de-restaurar_${ag.getFullYear()}-${pad(ag.getMonth()+1)}-${pad(ag.getDate())}_${pad(ag.getHours())}${pad(ag.getMinutes())}.json`,data:JSON.stringify(atual,null,1)})}
        const r=await FIO.restaurar(dados,(k,n)=>{info.textContent=`Restaurando… ${nomes[k]||k}: ${n}`});
        const feitos=Object.values(r).reduce((a,x)=>a+x,0);prev.innerHTML=`<p class="sub" style="margin-top:12px"><b>Restauração concluída:</b> ${feitos} registro${feitos===1?"":"s"} enviado${feitos===1?"":"s"}. O painel já foi atualizado.</p>`;info.textContent="";toast("Backup restaurado")}
      catch(err){b.disabled=false;$("#rsNo").disabled=false;delete b.dataset.arm;toast("A restauração falhou. Nada foi apagado. Confira a conexão e tente de novo.")}}};
  $("#pwMe").onsubmit=async e=>{e.preventDefault();const [a,b]=[...e.target.querySelectorAll("input")].map(i=>i.value);if(a.length<8){toast("Use pelo menos 8 caracteres.");return}if(a!==b){toast("As senhas não conferem.");return}
    const {error}=await FIO.sb.auth.updateUser({password:a});if(error)toast("Não foi possível trocar a senha.");else{e.target.reset();toast("Senha trocada")}};
}

/* ---------------- navegação ---------------- */
let PENDING=null;
function softRender(fn){const a=document.activeElement;if(a&&a.closest&&a.closest("#main")&&a.matches("input:not([type=radio]):not([type=checkbox]),textarea,select")){PENDING=fn;return}PENDING=null;const y=window.scrollY;fn();window.scrollTo(0,y)}
document.addEventListener("focusout",()=>setTimeout(()=>{if(PENDING)softRender(PENDING)},120));
function render(){
  if(S.apply&&S.apply.online){document.body.classList.remove("gate");document.body.classList.add("apply");renderApply();return}
  checkSessionVer();
  document.body.classList.toggle("gate",!S.auth);
  document.body.classList.toggle("apply",!!S.auth&&(!!S.apply||isAval()));
  if(!S.auth){renderGate();return}
  if(S.apply){renderApply();return}
  if(isAval()){renderAvalHome();return}
  if(S.view==="acesso"){document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("on",n.dataset.view==="acesso"));renderAccess();return}
  document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("on",n.dataset.view===S.view));
  ["q1","q2","q3"].forEach(q=>$("#c-"+q).textContent=S[q].length);
  if(S.view==="panorama")renderPanorama();else if(S.view==="abertas")renderAbertas();else if(S.view==="stats")renderStats();else if(S.view==="tema")renderTema();else if(S.view==="tutorial")renderTutorial();else renderQ(S.view);
  wireDemoToggles();
}
function wireDemoToggles(){
  ["#tgDemo","#tgDemo2"].forEach(sel=>{const b=$(sel);if(b)b.onclick=()=>{S.demo=!useDemo();if(S.ta){S.ta.st=useDemo()?"all":"todo";S.ta.show=30}render()}});
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
}
function go(v){if(!isAdmin())return;S.apply=null;S.view=v;try{localStorage.setItem("fio-view",v)}catch(e){}render();window.scrollTo({top:0})}
document.querySelectorAll(".nav[data-view]").forEach(n=>n.onclick=()=>go(n.dataset.view));$("#nav-sair").onclick=logout;
document.querySelectorAll("[data-apply]").forEach(b=>b.onclick=()=>startApply(b.dataset.apply));
const hashOnline=()=>{const m=(location.hash||"").match(/^#online-q3(?:-([A-Za-z0-9]+))?$/);if(!m)return false;S.apply={q:"q3",step:0,done:null,online:true,tok:m[1]||null,loading:true};return true};
async function resolveOnlineToken(){if(!S.apply||!S.apply.online)return;if(!S.apply.tok){S.apply.block="Este link não é válido.";S.apply.loading=false;render();return}
  try{const {data:v,error}=await FIO.sb.rpc("link_online",{tok:S.apply.tok});if(error)throw error;if(!v.valido)S.apply.block="Este link não é válido.";else if(v.usado)S.apply.block="Este link já foi usado.";else if(!v.geral)S.apply.resp=v.resp}catch(e){S.apply.block="Não foi possível abrir este link."}S.apply.loading=false;render()}
const hashApply=()=>{const m=(location.hash||"").match(/^#aplicar-(q[123])$/);if(m&&(!S.apply||S.apply.q!==m[1])){S.apply={q:m[1],step:0,done:null};return true}return false};
loadSession();if(!hashOnline())hashApply();window.addEventListener("hashchange",()=>{if(hashApply())render()});
try{const v=localStorage.getItem("fio-view");if(v&&(["panorama","abertas","stats","tema","tutorial","acesso"].includes(v)||SCHEMA[v]))S.view=v}catch(e){}
render();

/* ---------------- armazenamento ---------------- */
(async()=>{
  const db=window.FIO&&window.claude?await claude.use("db"):null;S.db=db;S.dbTried=true;
  if(!db){document.getElementById("main").innerHTML='<div class="gate"><div class="gcard"><h2>Painel não configurado</h2><p class="sub">Preencha web/config.js com o endereço e a chave pública do Supabase e o endereço da API. Veja o README.</p></div></div>';document.body.classList.add("gate");return}
  if(S.apply&&S.apply.online){resolveOnlineToken();return}
  bootAuth();
  ["q1","q2","q3"].forEach(q=>db.collection(q).onSnapshot(snap=>{
    S[q]=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded[q]=true;
    ["q1","q2","q3"].forEach(k=>$("#c-"+k).textContent=S[k].length);
    if(!S.auth){}else if(isAval()){if(!S.apply)renderAvalHome()}else if(S.apply){}else if(S.view==="acesso")softRender(renderAccess);else if(S.view===q)renderList(q);else if(S.view==="panorama")renderPanorama(),wireDemoToggles();else if(S.view==="abertas"&&!document.activeElement?.matches("#busca"))renderAbertas();
    else if(S.view==="stats")softRender(()=>{renderStats();wireDemoToggles()});else if(S.view==="tema")softRender(()=>{renderTema();wireDemoToggles()});
  },e=>toast("A conexão com os dados caiu. Recarregue a página.")));
  const ta=(col,fn)=>db.collection(col).onSnapshot(snap=>{fn(snap.docs.map(d=>({id:d.id,...d.data()})));if(isAdmin()&&S.view==="tema"&&!S.apply)softRender(()=>{renderTema();wireDemoToggles()})},()=>{});
  ta("links",a=>S.links=a);ta("codes",a=>S.codes=a);ta("cats",a=>S.cats=a);ta("temas",a=>S.temas=a);ta("sug",a=>S.sug=Object.fromEntries(a.map(d=>[d.id,d])));
  ta("cod",a=>{S.cod=a;const ids=[...new Set(a.map(c=>c.coder).filter(c=>c&&c!=="consenso"&&!S.names[c]))];if(ids.length&&S.user)S.user.profiles(ids).then(ps=>{ids.forEach(id=>{const p=ps&&ps[id];S.names[id]=(p&&p.name)||"Codificador "+id.slice(-4)});if(S.view==="tema")softRender(()=>{renderTema();wireDemoToggles()})}).catch(()=>{})});
  try{const u=await claude.use("user");S.user=u;if(u){S.uid=await u.id();const me=await u.me();if(S.uid)S.names[S.uid]=(me&&me.name?me.name:"Você")+" (você)";const ids=[...new Set(S.cod.map(c=>c.coder).filter(c=>c&&c!=="consenso"&&!S.names[c]))];if(ids.length){const ps=await u.profiles(ids);ids.forEach(id=>{const p=ps&&ps[id];S.names[id]=(p&&p.name)||"Codificador "+id.slice(-4)})}}}catch(e){}
})();
</script>
</body></html>
